name: RPM update test

# Test branch only. Reuse the existing Release workflow path so GitHub can
# dispatch this branch without adding a new workflow to the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpm-update-test
  cancel-in-progress: false

jobs:
  rpm-update-test:
    if: github.repository == 'fluoz/bacakomik-app-flutter' && github.ref == 'refs/heads/test/rpm-in-app-update'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate test build preparation
        run: python3 -m unittest discover -s .github/scripts -p 'test_rpm_update_test.py'

      - name: Prepare two versions and the test update endpoint
        run: python3 .github/scripts/prepare_rpm_update_test.py

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev rpm

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub test/features/update_test.dart test/features/rpm_update_test.dart

      - name: Build starter and update RPMs
        env:
          GOOGLE_DESKTOP_CLIENT_ID: ${{ secrets.GOOGLE_DESKTOP_CLIENT_ID }}
          GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}
        run: |
          for VERSION in "$START_VERSION" "$UPDATE_VERSION"; do
            flutter build linux --release --no-pub \
              --build-name="$VERSION" --build-number="$GITHUB_RUN_NUMBER" \
              --dart-define=GOOGLE_DESKTOP_CLIENT_ID="$GOOGLE_DESKTOP_CLIENT_ID" \
              --dart-define=GOOGLE_DESKTOP_CLIENT_SECRET="$GOOGLE_DESKTOP_CLIENT_SECRET"
            dart linux/packaging/check_bundle.dart
            python3 -c 'import json, sys; from pathlib import Path; data = json.loads(Path("build/linux/x64/release/bundle/data/flutter_assets/version.json").read_text()); assert data["version"] == sys.argv[1], data' "$VERSION"
            bash linux/packaging/build-rpm.sh "$VERSION"
            test "$(rpm -qp --queryformat '%{VERSION}' "dist/Yoru-$VERSION-linux-x86_64.rpm")" = "$VERSION"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-update-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/*.rpm
            .rpm-update-test/*.md
          include-hidden-files: true
          if-no-files-found: error

      - name: Publish two test prereleases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$UPDATE_TAG" "dist/Yoru-$UPDATE_VERSION-linux-x86_64.rpm" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "RPM update test: target $UPDATE_VERSION" \
            --notes-file .rpm-update-test/update.md

          # Do not publish the starter until its update has a usable digest.
          EXPECTED_DIGEST="sha256:$(sha256sum "dist/Yoru-$UPDATE_VERSION-linux-x86_64.rpm" | cut -d ' ' -f 1)"
          for ATTEMPT in 1 2 3 4 5; do
            DIGEST=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$UPDATE_TAG" \
              --jq '.assets[] | select(.name | endswith("-linux-x86_64.rpm")) | .digest')
            if [[ "$DIGEST" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
              break
            fi
            sleep 2
          done
          [[ "$DIGEST" =~ ^sha256:[[:xdigit:]]{64}$ ]] || {
            echo '::error::GitHub did not provide a SHA-256 digest for the update RPM'
            exit 1
          }
          test "$DIGEST" = "$EXPECTED_DIGEST"

          gh release create "$START_TAG" "dist/Yoru-$START_VERSION-linux-x86_64.rpm" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "RPM update test: install this first ($START_VERSION)" \
            --notes-file .rpm-update-test/starter.md

      - name: Show Fedora test steps
        run: cat .rpm-update-test/summary.md >> "$GITHUB_STEP_SUMMARY"
